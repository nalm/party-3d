<text x="165.0" y="956.0" font-family="Noto Sans CJK KR" font-size="15" font-weight="500" fill="#ffffff" text-anchor="middle">레이어 1</text>
<text x="234.0" y="958.0" font-family="Noto Sans CJK KR" font-size="24" font-weight="700" fill="#1a1a19" text-anchor="start">조직 형태</text>
<text x="110.0" y="992.0" font-family="Noto Sans CJK KR" font-size="15" font-weight="400" fill="#52514e" text-anchor="start">축이 아니라 유형 — 제도화 &#215; 개인화 2&#215;2</text>
<text x="275.0" y="1012.0" font-family="Noto Sans CJK KR" font-size="13" font-weight="400" fill="#898781" text-anchor="middle">개인화 낮음</text>
<text x="485.0" y="1012.0" font-family="Noto Sans CJK KR" font-size="13" font-weight="400" fill="#898781" text-anchor="middle">개인화 높음</text>
<text x="162.0" y="1053.0" font-family="Noto Sans CJK KR" font-size="13" font-weight="400" fill="#898781" text-anchor="end">제도화 높음</text>
<text x="162.0" y="1113.0" font-family="Noto Sans CJK KR" font-size="13" font-weight="400" fill="#898781" text-anchor="end">제도화 낮음</text>
