<text x="800.0" y="196.0" font-family="Noto Sans CJK KR" font-size="26" font-weight="700" fill="#1baf7a" text-anchor="middle">사회 · 문화</text>
<text x="800.0" y="222.0" font-family="Noto Sans CJK KR" font-size="18" font-weight="500" fill="#1a1a19" text-anchor="middle">TAN — 권위 · 전통</text>
<text x="800.0" y="797.0" font-family="Noto Sans CJK KR" font-size="18" font-weight="500" fill="#1a1a19" text-anchor="middle">GAL — 자유 · 개방</text>
<text x="1045.0" y="648.0" font-family="Noto Sans CJK KR" font-size="26" font-weight="700" fill="#2a78d6" text-anchor="start">경제</text>
<text x="1045.0" y="676.0" font-family="Noto Sans CJK KR" font-size="18" font-weight="500" fill="#1a1a19" text-anchor="start">시장 · 민영화</text>
<text x="555.0" y="360.0" font-family="Noto Sans CJK KR" font-size="18" font-weight="500" fill="#1a1a19" text-anchor="end">재분배 · 국가 개입</text>
<text x="555.0" y="650.0" font-family="Noto Sans CJK KR" font-size="26" font-weight="700" fill="#eb6834" text-anchor="end">민주주의 규범</text>
<text x="555.0" y="678.0" font-family="Noto Sans CJK KR" font-size="18" font-weight="500" fill="#1a1a19" text-anchor="end">반다원주의 — 규범 파괴</text>
<text x="555.0" y="706.0" font-family="Noto Sans CJK KR" font-size="15" font-weight="400" fill="#d03b3b" text-anchor="end">임계선 — 넘으면 체제 성격이 바뀐다</text>
<text x="1045.0" y="360.0" font-family="Noto Sans CJK KR" font-size="18" font-weight="500" fill="#1a1a19" text-anchor="start">다원주의 — 제도 수용</text>
<text x="80.0" y="208.0" font-family="Noto Sans CJK KR" font-size="17" font-weight="500" fill="#1a1a19" text-anchor="start">세 축은 서로 독립이다.</text>
<text x="80.0" y="234.0" font-family="Noto Sans CJK KR" font-size="16" font-weight="400" fill="#52514e" text-anchor="start">한 축의 위치가 다른 축을</text>
<text x="80.0" y="258.0" font-family="Noto Sans CJK KR" font-size="16" font-weight="400" fill="#52514e" text-anchor="start">결정하지 않는다.</text>
<text x="80.0" y="300.0" font-family="Noto Sans CJK KR" font-size="14" font-weight="400" fill="#898781" text-anchor="start">격자는 깊이 참조용이며</text>
<text x="80.0" y="322.0" font-family="Noto Sans CJK KR" font-size="14" font-weight="400" fill="#898781" text-anchor="start">아무 의미도 없다.</text>
