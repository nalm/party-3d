<text x="895.0" y="956.0" font-family="Noto Sans CJK KR" font-size="15" font-weight="500" fill="#ffffff" text-anchor="middle">레이어 2</text>
<text x="964.0" y="958.0" font-family="Noto Sans CJK KR" font-size="24" font-weight="700" fill="#1a1a19" text-anchor="start">포퓰리즘 태그</text>
<text x="840.0" y="992.0" font-family="Noto Sans CJK KR" font-size="15" font-weight="400" fill="#52514e" text-anchor="start">축에서 분리 — 수사 스타일로 별도 병기</text>
<rect x="840" y="1018" width="200" height="44" rx="22" fill="#FAECE7"/>
<text x="940.0" y="1046.0" font-family="Noto Sans CJK KR" font-size="16" font-weight="500" fill="#993C1D" text-anchor="middle">우파 포퓰리즘</text>
<rect x="1060" y="1018" width="200" height="44" rx="22" fill="#E6F1FB"/>
<text x="1160.0" y="1046.0" font-family="Noto Sans CJK KR" font-size="16" font-weight="500" fill="#185FA5" text-anchor="middle">좌파 포퓰리즘</text>
<rect x="1280" y="1018" width="200" height="44" rx="22" fill="#F1EFE8"/>
<text x="1380.0" y="1046.0" font-family="Noto Sans CJK KR" font-size="16" font-weight="500" fill="#444441" text-anchor="middle">해당 없음</text>
<text x="840.0" y="1102.0" font-family="Noto Sans CJK KR" font-size="15" font-weight="400" fill="#52514e" text-anchor="start">Medzihorsky &#38; Lindberg(2023): 민주주의 훼손을 예측하는 것은</text>
<text x="840.0" y="1128.0" font-family="Noto Sans CJK KR" font-size="15" font-weight="400" fill="#52514e" text-anchor="start">포퓰리즘이 아니라 반다원주의 &#8594; 같은 축에 두면 오분류</text>
<text x="80.0" y="1212.0" font-family="Noto Sans CJK KR" font-size="15" font-weight="400" fill="#898781" text-anchor="start">&#8251; 개념 설명용 3차원 도해. 정당별 좌표를 찍을 때는 2차원 산점도에 Z축을 색으로 인코딩할 것 — 3D는 깊이 판독이 되지 않는다.</text>
