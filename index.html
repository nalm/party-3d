<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- 전 좌표가 추정치인 동안 검색 색인을 막는다 — CLAUDE.md「공개 조건」 3항 -->
    <meta name="robots" content="noindex" />
    <title>정당 3축 탐색기</title>
    <style>
      :root {
        --bg: #0e1116;
        --fg: #e6eaf0;
        --dim: #9aa4b3;
        --panel: rgba(20, 25, 33, 0.9);
        --border: #2b3340;
        --warn-bg: rgba(160, 42, 42, 0.92);
        --sidebar-w: 254px;
        --panel-w: 352px;
        --banner-h: 24px; /* 하단 경고 바 높이 */
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; overflow: hidden; }
      body {
        background: var(--bg);
        color: var(--fg);
        font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
        font-size: 14px;
        line-height: 1.55;
      }

      /* 사이드바·패널·배너를 뺀 가운데 영역만 3D 뷰다.
         전체 창을 쓰면 큐브 중심이 패널 뒤로 밀려 가려진다. */
      #view, #labels, #view2d {
        position: fixed;
        top: 0; bottom: var(--banner-h);
        left: var(--sidebar-w); right: var(--panel-w);
      }
      #view canvas, #view2d canvas { display: block; }
      /* CSS2DRenderer 오버레이. 라벨은 클릭 대상이 아니므로 이벤트를 통과시킨다. */
      #labels { pointer-events: none; overflow: hidden; }

      /* 2D/3D 전환. 숨기는 쪽은 display:none으로 완전히 빼서 이벤트도 받지 않게 한다. */
      body.mode-2d #view, body.mode-2d #labels { display: none; }
      body:not(.mode-2d) #view2d { display: none; }
      /* 카메라 프리셋은 3D 전용이다 */
      body.mode-2d .ctl-sec--camera { display: none; }

      .axis-pole {
        font-size: 12px; font-weight: 600; letter-spacing: -0.01em; white-space: nowrap;
        text-shadow: 0 0 6px rgba(0,0,0,.95), 0 0 2px rgba(0,0,0,1);
      }
      .axis-tick {
        font-size: 10px; color: var(--dim); white-space: nowrap;
        text-shadow: 0 0 5px rgba(0,0,0,.95);
      }
      /* 축 눈금 숫자는 기본 숨김 — 뷰 섹션의 토글이 body.show-ticks를 단다.
         PNG 내보내기는 별도 캔버스라 이 설정과 무관하게 항상 숫자를 그린다. */
      #labels .axis-tick { display: none; }
      body.show-ticks #labels .axis-tick { display: block; }

      /* 국가 코드 태그. 래퍼는 크기 0으로 두어 점 중심에 앵커되게 하고,
         안쪽 span만 화면 오른쪽·위로 밀어낸다 (래퍼 transform은 CSS2DRenderer가 씀). */
      .country-tag { position: relative; width: 0; height: 0; }
      .country-tag span {
        position: absolute; left: 10px; top: -17px;
        font-size: 9.5px; font-weight: 600; letter-spacing: .02em;
        color: #7f8b9c; white-space: nowrap;
        text-shadow: 0 0 4px rgba(14,17,22,.95), 0 0 2px rgba(14,17,22,1);
      }
      body:not(.show-country) #labels .country-tag { display: none; }

      /* 상시 정당명. 국가 코드 태그와 같은 크기 0 래퍼 기법이며, 겹침은
         points.js의 cullPartyNames가 프레임마다 visibility로 처리한다. */
      .party-name { position: relative; width: 0; height: 0; }
      /* 국가 코드는 점 위(top −17px), 정당명은 점 아래(top +4px)로 갈라 둔다 */
      .party-name span {
        position: absolute; left: 10px; top: 4px;
        font-size: 11px; font-weight: 600; letter-spacing: -0.01em;
        color: #dde3ec; white-space: nowrap;
        text-shadow: 0 0 5px rgba(14,17,22,.98), 0 0 2px rgba(14,17,22,1);
      }
      body:not(.show-names) #labels .party-name { display: none; }

      /* ── 하단 경고 배너 (2026-07-30 편집국 결정: 상단 대형 → 하단 소형) ──
         PNG 내보내기의 경고 각인은 그대로 크게 유지된다. 이미지는 단독 유통되기 때문. */
      #banner {
        position: fixed; bottom: 0; left: 0; right: 0; z-index: 40;
        background: rgba(20, 25, 33, 0.92); color: #d8a0a0;
        padding: 3px 14px; display: flex; gap: 8px; align-items: baseline;
        border-top: 1px solid var(--border);
        backdrop-filter: blur(6px);
      }
      #banner strong { font-size: 10.5px; white-space: nowrap; font-weight: 600; }
      #banner span {
        font-size: 10px; color: #8c96a5;
        white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      }

      /* ── 좌측 사이드바 ── */
      #sidebar {
        position: fixed; top: 0; left: 0; bottom: var(--banner-h); width: var(--sidebar-w);
        z-index: 25; overflow-y: auto;
        background: var(--panel); border-right: 1px solid var(--border);
        backdrop-filter: blur(8px); padding: 12px 12px 24px;
      }
      #titlebar h1 { margin: 0; font-size: 16px; letter-spacing: -0.02em; }
      #titlebar p { margin: 2px 0 0; font-size: 11px; color: var(--dim); }

      #sidebar h2 {
        margin: 0 0 6px; font-size: 11px; font-weight: 700; color: var(--dim);
        letter-spacing: .04em; border-bottom: 1px solid var(--border); padding-bottom: 4px;
      }
      #viewtoggle, #filters, .ctl-sec, #legend, #country-legend { margin-top: 15px; }

      /* ── 2D/3D 전환 · 내보내기 ── */
      .seg { display: flex; gap: 0; }
      .seg button {
        flex: 1; background: rgba(255,255,255,.05); border: 1px solid var(--border);
        color: var(--dim); font-size: 12px; padding: 6px 4px; cursor: pointer;
        font-family: inherit;
      }
      .seg button:first-child { border-radius: 4px 0 0 4px; }
      .seg button:last-child { border-radius: 0 4px 4px 0; border-left: none; }
      .seg button.on { background: #2a5fa0; border-color: #3f7bc4; color: #fff; font-weight: 700; }
      .export-btn {
        width: 100%; margin-top: 7px; background: rgba(74,158,255,.14);
        border: 1px solid #3f6fa8; color: #cfe2ff; font-size: 12px; padding: 6px;
        border-radius: 4px; cursor: pointer; font-family: inherit;
      }
      .export-btn:hover { background: rgba(74,158,255,.26); }
      .hint { margin: 6px 0 0; font-size: 10.5px; color: #8c96a5; line-height: 1.45; }
      .warn-hint { color: #e0a48c; }

      /* ── 필터 ── */
      .facet { margin-bottom: 9px; }
      .facet-head { display: flex; align-items: center; gap: 5px; margin-bottom: 3px; }
      .facet-title { font-size: 11px; font-weight: 700; flex: 1; }
      .mini {
        background: none; border: 1px solid var(--border); color: var(--dim);
        font-size: 9.5px; padding: 1px 5px; border-radius: 3px; cursor: pointer;
        font-family: inherit;
      }
      .mini:hover { color: var(--fg); border-color: #445; }
      .facet-list { display: flex; flex-wrap: wrap; gap: 2px 9px; }
      .chk { display: flex; align-items: center; gap: 4px; font-size: 11px; cursor: pointer; }
      .chk input { margin: 0; width: 12px; height: 12px; accent-color: #4a9eff; cursor: pointer; }
      .hide-toggle { margin-top: 9px; font-size: 11.5px; }
      .filter-count {
        margin: 7px 0 0; font-size: 11px; color: var(--fg);
        font-variant-numeric: tabular-nums;
      }

      /* ── 시점 프리셋 ── */
      .btn-row { display: flex; flex-direction: column; gap: 4px; }
      .preset {
        background: rgba(255,255,255,.05); border: 1px solid var(--border); color: var(--fg);
        font-size: 11.5px; padding: 5px 8px; border-radius: 4px; cursor: pointer;
        text-align: left; font-family: inherit;
      }
      .preset:hover { background: rgba(255,255,255,.12); border-color: #4a5568; }

      /* ── 절단점 슬라이더 ── */
      .cut-row { margin-bottom: 9px; }
      .cut-head { display: flex; align-items: baseline; gap: 6px; }
      .cut-label { font-size: 11px; flex: 1; }
      .cut-val { font-size: 12px; font-weight: 700; font-variant-numeric: tabular-nums; }
      input[type="range"] { width: 100%; margin: 3px 0 0; accent-color: #eda100; height: 14px; }

      .reset-btn {
        width: 100%; background: rgba(255,255,255,.07); border: 1px solid var(--border);
        color: var(--fg); font-size: 12px; padding: 6px; border-radius: 4px;
        cursor: pointer; font-family: inherit;
      }
      .reset-btn:hover { background: rgba(255,255,255,.14); }

      /* ── 범례 ── */
      .band-row { display: flex; align-items: center; gap: 7px; margin: 3px 0; font-size: 11.5px; }
      /* 규범 구간 견본은 '윤곽선 색 + 도형'이다. 채움색은 국가를 뜻하므로
         범례에서 채우면 색의 의미를 잘못 가르친다. */
      .band-swatch {
        width: 12px; height: 12px; flex: 0 0 auto;
        border: 2px solid currentColor; background: transparent;
      }
      .band-swatch.sphere { border-radius: 50%; }
      .band-swatch.octahedron { transform: rotate(45deg); }
      .band-swatch.tetrahedron {
        border: none; background: currentColor;
        clip-path: polygon(50% 0, 100% 100%, 0 100%);
      }

      /* 국가 범례 — 채움색 견본 */
      .country-list { display: flex; flex-wrap: wrap; gap: 3px 10px; }
      .country-row { display: flex; align-items: center; gap: 5px; font-size: 11px; }
      .country-dot { width: 10px; height: 10px; border-radius: 50%; flex: 0 0 auto; }
      .country-code { color: var(--dim); font-size: 9.5px; font-weight: 600; }

      /* ── 호버·선택 라벨 ── */
      .point-label {
        font-size: 12px; font-weight: 700; white-space: nowrap;
        padding: 1px 6px; border-radius: 3px;
        background: rgba(10,13,18,.82); border: 1px solid var(--border);
        text-shadow: 0 0 4px rgba(0,0,0,.9);
      }
      .point-label.selected {
        border-color: #fff; background: rgba(255,255,255,.94);
        color: #10141a; text-shadow: none;
      }
      /* 궤적 양 끝점 라벨. 호버·선택 라벨은 점 위쪽이라 이쪽은 아래쪽에 붙는다. */
      .traj-label {
        font-size: 10.5px; font-weight: 600; white-space: nowrap; color: #cdd5e0;
        padding: 0 4px; border-radius: 2px; background: rgba(10,13,18,.7);
        text-shadow: 0 0 4px rgba(0,0,0,.95);
      }

      /* ── 궤적 변화량 ── */
      .delta-item { border-left: 3px solid var(--border); padding: 5px 0 6px 9px; margin-bottom: 8px; }
      .delta-head { display: flex; align-items: baseline; gap: 7px; flex-wrap: wrap; }
      .delta-name { font-size: 11.5px; font-weight: 700; }
      .delta-move { font-size: 11.5px; color: var(--dim); font-variant-numeric: tabular-nums; }
      .delta-amount {
        font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums; color: #ffd479;
      }
      .delta-amount.delta-flat { color: var(--dim); font-weight: 400; font-size: 13px; }
      .delta-tag {
        font-size: 9.5px; padding: 1px 5px; border-radius: 2px; font-weight: 700;
        background: rgba(255,255,255,.07); color: var(--dim);
      }
      .delta-ratio { margin: 2px 0 0; font-size: 10.5px; color: #8c96a5; }
      .delta-segs { margin-top: 4px; }

      /* ── 상세 패널 ── */
      #panel {
        position: fixed; top: 0; right: 0; bottom: var(--banner-h); width: var(--panel-w);
        z-index: 25; background: var(--panel); border-left: 1px solid var(--border);
        backdrop-filter: blur(8px); overflow-y: auto; padding: 14px 16px 28px;
      }
      #panel.open { box-shadow: -12px 0 32px rgba(0,0,0,.4); }
      .panel-empty { margin: 4px 0; font-size: 12px; color: var(--dim); }

      .panel-close {
        float: right; margin: -4px -4px 0 0; background: none; border: none;
        color: var(--dim); font-size: 21px; line-height: 1; cursor: pointer; padding: 2px 6px;
      }
      .panel-close:hover { color: var(--fg); }

      .panel-head h2 { margin: 0; font-size: 18px; letter-spacing: -0.02em; border: none; padding: 0; color: var(--fg); }
      .name-local { margin: 1px 0 0; font-size: 12px; color: var(--dim); }
      .meta-line { margin: 3px 0 0; font-size: 11px; color: var(--dim); }

      #panel section { margin-top: 16px; }
      #panel h3 {
        margin: 0 0 7px; font-size: 11px; font-weight: 700; color: var(--dim);
        letter-spacing: .04em; border-bottom: 1px solid var(--border); padding-bottom: 4px;
      }

      .kv { display: grid; grid-template-columns: 74px 1fr; gap: 8px; margin: 3px 0; font-size: 11.5px; }
      .kv-k { color: var(--dim); }
      .kv-v { color: var(--fg); word-break: break-word; }
      .kv.warn .kv-v { color: #ffb0a0; }
      .kv.note .kv-v { color: #cfd6e0; font-style: italic; }

      .axis-item { border-left: 3px solid var(--border); padding: 6px 0 8px 9px; margin-bottom: 11px; }
      .axis-head { display: flex; align-items: baseline; gap: 7px; flex-wrap: wrap; margin-bottom: 5px; }
      .axis-name { font-size: 12px; font-weight: 700; }
      .axis-val { font-size: 17px; font-weight: 700; font-variant-numeric: tabular-nums; }
      .axis-scale { font-size: 10.5px; color: var(--dim); }

      .badge { font-size: 9.5px; padding: 1px 5px; border-radius: 2px; font-weight: 700; }
      .badge-est { background: rgba(237,161,0,.2); color: #f0bc4a; border: 1px dashed #a87d16; }
      .badge-meas { background: rgba(27,175,122,.18); color: #4ed4a2; border: 1px solid #1baf7a; }

      .src-box {
        margin-top: 6px; padding: 7px 8px; background: rgba(0,0,0,.3);
        border: 1px solid var(--border); border-radius: 4px;
      }
      .src-box .kv { grid-template-columns: 60px 1fr; font-size: 11px; margin: 2px 0; }

      .layer-note { margin: 7px 0 0; font-size: 10.5px; color: #8c96a5; line-height: 1.45; }

      /* ── 반응형 ── */
      /* 시트 여닫이 버튼. 넓은 화면에서는 필요 없다.
         이 기본 규칙은 아래 미디어쿼리보다 반드시 먼저 와야 한다 — 같은 특이도라
         뒤에 두면 미디어쿼리의 display:flex를 덮어써 모바일에서 버튼이 사라진다. */
      #sheet-tabs {
        display: none; position: fixed; z-index: 36; bottom: calc(var(--banner-h) + 10px); left: 12px; gap: 8px;
      }
      #sheet-tabs button {
        background: rgba(20,25,33,.94); border: 1px solid var(--border); color: var(--fg);
        font-size: 12px; padding: 7px 12px; border-radius: 18px; cursor: pointer;
        font-family: inherit; backdrop-filter: blur(6px);
      }

      @media (max-width: 1180px) {
        :root { --sidebar-w: 224px; --panel-w: 300px; }
      }

      /* 태블릿·모바일: 사이드바와 패널을 접히는 시트로 바꾸고 뷰가 전체 폭을 쓴다 */
      @media (max-width: 860px) {
        :root { --sidebar-w: 0px; --panel-w: 0px; }
        #view, #labels, #view2d { left: 0; right: 0; }

        #sidebar, #panel {
          width: min(320px, 88vw);
          transform: translateX(-100%);
          transition: transform .22s ease;
          z-index: 35;
        }
        #panel { transform: translateX(100%); left: auto; right: 0; }
        body.sheet-left #sidebar { transform: translateX(0); }
        body.sheet-right #panel { transform: translateX(0); }

        #sheet-tabs { display: flex; }
      }
    </style>
  </head>
  <body>
    <div id="banner"><strong></strong><span></span></div>

    <div id="view"></div>
    <div id="labels"></div>
    <div id="view2d"><canvas></canvas></div>

    <div id="sidebar">
      <div id="titlebar">
        <h1></h1>
        <p></p>
      </div>

      <div id="viewtoggle"></div>
      <div id="filters"></div>
      <div id="controls"></div>

      <div id="country-legend">
        <h2></h2>
        <div class="country-list" id="country-rows"></div>
        <p class="hint" id="country-legend-note"></p>
      </div>

      <div id="legend">
        <h2></h2>
        <div id="band-rows"></div>
        <p class="hint" id="band-cut-caption"></p>
        <p class="hint" id="estimated-caption"></p>
      </div>
    </div>

    <aside id="panel"></aside>

    <!-- 좁은 화면에서만 보이는 시트 여닫이 -->
    <div id="sheet-tabs">
      <button data-sheet="left">조작</button>
      <button data-sheet="right">상세</button>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
