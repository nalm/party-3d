<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- 전 좌표가 추정치인 동안 검색 색인을 막는다 — CLAUDE.md「공개 조건」 3항 -->
    <meta name="robots" content="noindex" />
    <title>정당 3축 탐색기</title>
    <style>
      :root {
        --bg: #0e1116;
        --fg: #e6eaf0;
        --dim: #9aa4b3;
        --panel: rgba(20, 25, 33, 0.88);
        --border: #2b3340;
        --warn-bg: rgba(160, 42, 42, 0.92);
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; overflow: hidden; }
      body {
        background: var(--bg);
        color: var(--fg);
        font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
        font-size: 14px;
        line-height: 1.55;
      }

      #view { position: fixed; inset: 0; }
      #view canvas { display: block; }

      /* CSS2DRenderer 오버레이. 라벨 자체는 클릭 대상이 아니므로 이벤트를 통과시킨다. */
      #labels { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }

      .axis-pole {
        font-size: 12px;
        font-weight: 600;
        letter-spacing: -0.01em;
        white-space: nowrap;
        text-shadow: 0 0 6px rgba(0, 0, 0, 0.95), 0 0 2px rgba(0, 0, 0, 1);
      }
      .axis-tick {
        font-size: 10px;
        color: var(--dim);
        white-space: nowrap;
        text-shadow: 0 0 5px rgba(0, 0, 0, 0.95);
      }

      #banner {
        position: fixed;
        top: 0; left: 0; right: 0;
        z-index: 30;
        background: var(--warn-bg);
        color: #fff;
        padding: 8px 14px;
        display: flex;
        gap: 12px;
        align-items: baseline;
        border-bottom: 1px solid rgba(255, 255, 255, 0.25);
      }
      #banner strong { font-size: 13px; white-space: nowrap; }
      #banner span { font-size: 12px; color: rgba(255, 255, 255, 0.92); }

      #titlebar {
        position: fixed; top: 46px; left: 14px; z-index: 20;
      }
      #titlebar h1 { margin: 0; font-size: 17px; letter-spacing: -0.02em; }
      #titlebar p { margin: 2px 0 0; font-size: 12px; color: var(--dim); }

      #legend {
        position: fixed; bottom: 14px; left: 14px; z-index: 20;
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 10px 12px;
        max-width: 300px;
        backdrop-filter: blur(6px);
      }
      #legend h2 { margin: 0 0 7px; font-size: 12px; color: var(--dim); font-weight: 600; }
      .band-row { display: flex; align-items: center; gap: 8px; margin: 4px 0; font-size: 12px; }
      .band-swatch { width: 13px; height: 13px; flex: 0 0 auto; }
      .band-swatch.sphere { border-radius: 50%; }
      .band-swatch.octahedron { transform: rotate(45deg); }
      .band-swatch.tetrahedron { clip-path: polygon(50% 0, 100% 100%, 0 100%); }
      .legend-note { margin: 7px 0 0; font-size: 11px; color: var(--dim); }

      /* 범례(좌)와 패널(우) 사이에 둔다 */
      #captions {
        position: fixed; bottom: 14px; left: 326px; right: 366px; z-index: 20;
        text-align: center; font-size: 11px; color: var(--dim);
      }
      #captions p { margin: 0 0 5px; }

      /* ── 호버·선택 라벨 ── */
      .point-label {
        font-size: 12px;
        font-weight: 700;
        white-space: nowrap;
        padding: 1px 6px;
        border-radius: 3px;
        background: rgba(10, 13, 18, 0.82);
        border: 1px solid var(--border);
        text-shadow: 0 0 4px rgba(0, 0, 0, 0.9);
      }
      .point-label.selected {
        border-color: #fff;
        background: rgba(255, 255, 255, 0.94);
        color: #10141a;
        text-shadow: none;
      }

      /* ── 상세 패널 ── */
      #panel {
        position: fixed; top: 46px; right: 0; bottom: 0; width: 352px; z-index: 25;
        background: var(--panel);
        border-left: 1px solid var(--border);
        backdrop-filter: blur(8px);
        overflow-y: auto;
        padding: 14px 16px 28px;
      }
      #panel.open { box-shadow: -12px 0 32px rgba(0, 0, 0, 0.4); }
      .panel-empty { margin: 4px 0; font-size: 12px; color: var(--dim); }

      .panel-close {
        float: right; margin: -4px -4px 0 0;
        background: none; border: none; color: var(--dim);
        font-size: 21px; line-height: 1; cursor: pointer; padding: 2px 6px;
      }
      .panel-close:hover { color: var(--fg); }

      .panel-head h2 { margin: 0; font-size: 18px; letter-spacing: -0.02em; }
      .name-local { margin: 1px 0 0; font-size: 12px; color: var(--dim); }
      .meta-line { margin: 3px 0 0; font-size: 11px; color: var(--dim); }

      #panel section { margin-top: 16px; }
      #panel h3 {
        margin: 0 0 7px; font-size: 11px; font-weight: 700;
        color: var(--dim); letter-spacing: 0.04em;
        border-bottom: 1px solid var(--border); padding-bottom: 4px;
      }

      .kv { display: grid; grid-template-columns: 74px 1fr; gap: 8px; margin: 3px 0; font-size: 11.5px; }
      .kv-k { color: var(--dim); }
      .kv-v { color: var(--fg); word-break: break-word; }
      .kv.warn .kv-v { color: #ffb0a0; }
      .kv.note .kv-v { color: #cfd6e0; font-style: italic; }

      .axis-item {
        border-left: 3px solid var(--border);
        padding: 6px 0 8px 9px;
        margin-bottom: 11px;
      }
      .axis-head { display: flex; align-items: baseline; gap: 7px; flex-wrap: wrap; margin-bottom: 5px; }
      .axis-name { font-size: 12px; font-weight: 700; }
      .axis-val { font-size: 17px; font-weight: 700; font-variant-numeric: tabular-nums; }
      .axis-scale { font-size: 10.5px; color: var(--dim); }

      .badge { font-size: 9.5px; padding: 1px 5px; border-radius: 2px; font-weight: 700; }
      .badge-est { background: rgba(237, 161, 0, 0.2); color: #f0bc4a; border: 1px dashed #a87d16; }
      .badge-meas { background: rgba(27, 175, 122, 0.18); color: #4ed4a2; border: 1px solid #1baf7a; }

      .src-box {
        margin-top: 6px; padding: 7px 8px;
        background: rgba(0, 0, 0, 0.3);
        border: 1px solid var(--border); border-radius: 4px;
      }
      .src-box .kv { grid-template-columns: 60px 1fr; font-size: 11px; margin: 2px 0; }

      .layer-note { margin: 7px 0 0; font-size: 10.5px; color: #8c96a5; line-height: 1.45; }
    </style>
  </head>
  <body>
    <div id="banner"><strong></strong><span></span></div>

    <div id="titlebar">
      <h1></h1>
      <p></p>
    </div>

    <div id="view"></div>
    <div id="labels"></div>

    <div id="legend">
      <h2></h2>
      <div id="band-rows"></div>
      <p class="legend-note" id="band-cut-caption"></p>
      <p class="legend-note" id="estimated-caption"></p>
    </div>

    <div id="captions">
      <p id="grid-caption"></p>
      <p id="independence-caption"></p>
    </div>

    <aside id="panel"></aside>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
